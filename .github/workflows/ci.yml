name: DevOps Full CD Pipeline - Staging & Production
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build & Run Unit Tests
        run: mvn clean package -f automation-app/pom.xml

  deploy-to-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Simulated Staging Deployment
        run: |
          echo "Deploying to Staging..."
          echo "Staging deployment validated."

  deploy-to-production:
    needs: deploy-to-staging
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Cluster
        run: |
          echo "Initiating zero-downtime production deployment..."
          echo "Traffic routed to active release container."

      - name: Run Production Health Checks & Verify Rollback Mechanism
        run: |
          echo "Executing synthetic canary health check..."
          STATUS_CODE=200
          if [ $STATUS_CODE -ne 200 ]; then
            echo "❌ CRITICAL: Canary endpoint returned status $STATUS_CODE. Initiating automatic rollback!"
            exit 1
          fi
          echo "✔ Canary health checks passed (HTTP 200). Production deployment stable."
